<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Friendly Padel — регистрация</title>
<meta name="theme-color" content="#0f2438" />
<meta property="og:title" content="Friendly Padel" />
<meta property="og:description" content="Клуб дружеского падела. Добавь себя в список игроков." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg1:#0c1f33; --bg2:#123049; --card:#17324c; --card2:#1b3a58;
    --line:#26496b; --lime:#c6f24a; --lime-dim:#9fce3a;
    --text:#eaf2f8; --muted:#8aa6bf; --gold:#f2c230; --danger:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:'Montserrat',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #16385280, transparent),
               linear-gradient(180deg,var(--bg2),var(--bg1) 60%);
    background-attachment:fixed;
    color:var(--text); min-height:100vh; line-height:1.5;
  }
  .wrap{max-width:520px; margin:0 auto; padding:26px 18px 60px}
  /* ------- header ------- */
  .brand{text-align:center; margin:8px 0 6px}
  .brand .row{display:flex; align-items:center; justify-content:center; gap:14px}
  .brand h1{font-weight:900; letter-spacing:.16em; font-size:30px; margin:0; line-height:1.05}
  .brand .l1{color:#fff}
  .brand .l2{color:var(--lime); letter-spacing:.34em; font-size:26px; display:block; margin-top:2px}
  .ball{width:30px;height:30px;flex:0 0 auto}
  .subtitle{color:var(--muted); text-transform:uppercase; letter-spacing:.22em; font-size:11px; margin-top:12px; font-weight:600}
  .divider{height:3px;width:120px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--lime),transparent);border-radius:3px}
  /* ------- card ------- */
  .card{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line);
    border-radius:20px; padding:22px 18px; margin-top:22px; box-shadow:0 18px 40px -22px #000a}
  .card h2{font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--lime); margin:0 0 4px; font-weight:700}
  .card p.hint{margin:0 0 18px; color:var(--muted); font-size:13px}
  /* ------- avatar picker ------- */
  .avatar-pick{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:18px}
  .avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;position:relative;
    background:#0e263c; border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
  .avatar:active{transform:scale(.97)}
  .avatar.filled{border-style:solid;border-color:var(--lime)}
  .avatar img{width:100%;height:100%;object-fit:cover;display:none}
  .avatar.filled img{display:block}
  .avatar .cam{color:var(--muted);font-size:12px;text-align:center;padding:0 8px;line-height:1.3}
  .avatar.filled .cam{display:none}
  .avatar-note{color:var(--muted);font-size:12px}
  input[type=file]{display:none}
  /* ------- fields ------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;font-weight:600}
  .field input{width:100%;padding:14px 14px;border-radius:12px;border:1px solid var(--line);
    background:#0e263c;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:.15s}
  .field input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c6f24a22}
  .field input::placeholder{color:#5f7d99}
  .opt{color:#5f7d99;font-weight:500}
  .btn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--lime);color:#0c1f33;
    font-weight:800;font-size:16px;letter-spacing:.03em;cursor:pointer;font-family:inherit;
    transition:.15s;margin-top:6px}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}
  .msg.ok{color:var(--lime)} .msg.err{color:var(--danger)}
  /* ------- roster ------- */
  .roster-head{display:flex;align-items:center;justify-content:space-between;margin:30px 4px 12px}
  .roster-head h3{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:0;font-weight:700}
  .count{background:var(--lime);color:#0c1f33;font-weight:800;font-size:13px;padding:4px 12px;border-radius:20px}
  .list{display:flex;flex-direction:column;gap:10px}
  .player{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .player .num{color:var(--muted);font-weight:700;width:22px;text-align:center;flex:0 0 auto;font-size:14px}
  .pa{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:#0e263c;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .pa img{width:100%;height:100%;object-fit:cover}
  .pa .ini{font-weight:800;color:var(--lime);font-size:16px}
  .player .info{min-width:0}
  .player .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player .nk{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 10px}
  .foot{text-align:center;color:#4d6a85;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;margin-top:34px;font-weight:600}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #0c1f3355;border-top-color:#0c1f33;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .skel{color:var(--muted);text-align:center;padding:16px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="row">
      <svg class="ball" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#c6f24a"/><path d="M6 12c8 3 8 13 0 16M34 12c-8 3-8 13 0 16" fill="none" stroke="#0c1f33" stroke-width="2.4" stroke-linecap="round"/></svg>
      <h1><span class="l1">FRIENDLY</span><span class="l2">PADEL</span></h1>
      <svg class="ball" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#c6f24a"/><path d="M6 12c8 3 8 13 0 16M34 12c-8 3-8 13 0 16" fill="none" stroke="#0c1f33" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div class="subtitle">Клуб дружеского падела · Астана</div>
    <div class="divider"></div>
  </div>

  <div class="card">
    <h2>Регистрация игрока</h2>
    <p class="hint">Добавь себя в список клуба. По этой базе будем считать статистику и делать разбор игр.</p>

    <div class="avatar-pick">
      <label class="avatar" id="avatarBox" for="photo">
        <img id="preview" alt="" />
        <span class="cam">📷<br/>Фото</span>
      </label>
      <input type="file" id="photo" accept="image/*" />
      <div class="avatar-note">Фото по желанию · можно добавить позже</div>
    </div>

    <div class="field">
      <label>Имя</label>
      <input id="first" type="text" autocomplete="given-name" placeholder="Нуржан" maxlength="40" />
    </div>
    <div class="field">
      <label>Фамилия</label>
      <input id="last" type="text" autocomplete="family-name" placeholder="Ваша фамилия" maxlength="40" />
    </div>
    <div class="field">
      <label>Позывной <span class="opt">(по желанию)</span></label>
      <input id="nick" type="text" placeholder="Как зовут на корте" maxlength="30" />
    </div>

    <button class="btn" id="submit">Добавить себя в клуб</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="roster-head">
    <h3>Игроки клуба</h3>
    <span class="count" id="count">0</span>
  </div>
  <div class="list" id="list"><div class="skel">Загрузка списка…</div></div>

  <div class="foot">Friendly Padel Club · 2026</div>
</div>

<script>
const SUPABASE_URL = "https://xligmfdnjcrgoqtphqia.supabase.co";
const SUPABASE_ANON = "sb_publishable_t0MwmWdeZ-umh2V2w1Fjmg_OqMmUbgD";
const REST = SUPABASE_URL + "/rest/v1";
const H = { apikey: SUPABASE_ANON, Authorization: "Bearer " + SUPABASE_ANON };

const $ = s => document.querySelector(s);
const msg = $("#msg");
let photoFile = null;

// ---- предпросмотр + сжатие фото ----
$("#photo").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  photoFile = f;
  const url = URL.createObjectURL(f);
  $("#preview").src = url;
  $("#avatarBox").classList.add("filled");
});

function resizeImage(file, max = 640) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => resolve(b), "image/jpeg", 0.82);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

async function uploadPhoto() {
  if (!photoFile) return null;
  const blob = await resizeImage(photoFile);
  const name = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".jpg";
  const res = await fetch(SUPABASE_URL + "/storage/v1/object/avatars/" + name, {
    method: "POST",
    headers: { ...H, "Content-Type": "image/jpeg", "x-upsert": "true" },
    body: blob
  });
  if (!res.ok) throw new Error("photo");
  return SUPABASE_URL + "/storage/v1/object/public/avatars/" + name;
}

// ---- отправка формы ----
$("#submit").addEventListener("click", async () => {
  const first = $("#first").value.trim();
  const last = $("#last").value.trim();
  const nick = $("#nick").value.trim();
  msg.className = "msg";
  if (!first || !last) {
    msg.className = "msg err";
    msg.textContent = "Заполни имя и фамилию";
    return;
  }
  const btn = $("#submit");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Сохраняю…';
  try {
    let photo_url = null;
    try { photo_url = await uploadPhoto(); }
    catch { /* фото не критично — сохраняем без него */ }
    const res = await fetch(REST + "/players", {
      method: "POST",
      headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ first_name: first, last_name: last, nickname: nick || null, photo_url })
    });
    if (!res.ok) throw new Error("insert");
    msg.className = "msg ok";
    msg.textContent = "Готово! Ты в списке клуба 🎾";
    $("#first").value = ""; $("#last").value = ""; $("#nick").value = "";
    photoFile = null; $("#avatarBox").classList.remove("filled"); $("#preview").src = "";
    loadPlayers();
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = "Не удалось сохранить. Попробуй ещё раз.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Добавить себя в клуб";
  }
});

// ---- список игроков ----
function initials(f, l) { return ((f[0] || "") + (l[0] || "")).toUpperCase(); }
function esc(s){ return (s||"").replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

async function loadPlayers() {
  const list = $("#list");
  try {
    const res = await fetch(REST + "/players?select=first_name,last_name,nickname,photo_url&order=created_at.asc", { headers: H });
    const rows = await res.json();
    $("#count").textContent = rows.length;
    if (!rows.length) { list.innerHTML = '<div class="empty">Пока никого. Будь первым 🎾</div>'; return; }
    list.innerHTML = rows.map((p, i) => {
      const av = p.photo_url
        ? `<div class="pa"><img src="${esc(p.photo_url)}" alt=""></div>`
        : `<div class="pa"><span class="ini">${esc(initials(p.first_name, p.last_name))}</span></div>`;
      const nk = p.nickname ? `<div class="nk">${esc(p.nickname)}</div>` : "";
      return `<div class="player"><div class="num">${i + 1}</div>${av}
        <div class="info"><div class="nm">${esc(p.first_name)} ${esc(p.last_name)}</div>${nk}</div></div>`;
    }).join("");
  } catch (e) {
    list.innerHTML = '<div class="empty">Не удалось загрузить список</div>';
  }
}
loadPlayers();
</script>
</body>
</html>
